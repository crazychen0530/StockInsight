name: stockinsight-local

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockinsight}
      POSTGRES_USER: ${POSTGRES_USER:-stockinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private local password in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./backend
    environment:
      # Credentials are passed via libpq variables, never interpolated into the URL.
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      SOURCE_POLICY_DIRECTORY: /workspace/source-settings
      LOCAL_ADMIN_TOKEN: ${LOCAL_ADMIN_TOKEN:-}
      DATABASE_URL: postgresql+psycopg:///${POSTGRES_DB:-stockinsight}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-stockinsight}
      PGUSER: ${POSTGRES_USER:-stockinsight}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a private local password in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/workspace/backend:ro
      - ./data/source-settings:/workspace/source-settings
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/workspace/frontend/src:ro
      - ./frontend/tests:/workspace/frontend/tests:ro
      - ./frontend/index.html:/workspace/frontend/index.html:ro
      - ./frontend/vite.config.ts:/workspace/frontend/vite.config.ts:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:5173/'); if (!r.ok) process.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  scheduler:
    profiles: [automation]
    build:
      context: ./backend
      args:
        INSTALL_EXTRAS: dev,market-data
    restart: unless-stopped
    environment:
      APP_ENV: development
      SOURCE_POLICY_DIRECTORY: /workspace/source-settings
      DATABASE_URL: postgresql+psycopg:///${POSTGRES_DB:-stockinsight}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-stockinsight}
      PGUSER: ${POSTGRES_USER:-stockinsight}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a private local password in .env}
      MARKET_DATA_DAILY_INTERFACE: ${MARKET_DATA_DAILY_INTERFACE:-stock_zh_a_hist_tx}
      MARKET_DATA_TIMEOUT_SECONDS: "120"
    volumes:
      - ./backend:/workspace/backend:ro
      - ./data/source-settings:/workspace/source-settings:ro
      - ./config/calendars:/workspace/calendars:ro
    command: [python, -m, app.jobs.scheduler, --calendar, /workspace/calendars/sse_szse_2026.json, --symbol, "000001.SZ", --symbol, "600519.SH", --symbol, "300750.SZ", --symbol, "600036.SH", --initial-start, "2026-01-05", --catch-up]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
